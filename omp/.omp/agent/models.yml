# ~/.omp/agent/models.yml — provider / model registry overrides
#
# Only DeepSeek needs anything here, and only for metadata (see below). Every
# provider this config uses authenticates through `/login`, which stores the
# credential in omp's own store — so no apiKey lines and no .env. An explicit
# apiKey here would override that stored credential.

providers:
  # ---------------------------------------------------------------- DeepSeek
  # DeepSeek-V4.1-Flash went GA 2026-09-10 under the bare id `deepseek-flash`.
  # As of omp 18.1.16 the catalog taxonomy cannot classify that id, so the
  # discovered row is an empty shell (free / text-only / no effort tiers).
  # Declaring it here replaces the shell (same provider+id wins) and puts the
  # low|high|max effort selectors back on the wire. Safe to keep after the
  # catalog fix lands — the values are the ones DeepSeek publishes.
  deepseek:
    baseUrl: https://api.deepseek.com/v1
    api: openai-completions
    models:
      - id: deepseek-flash
        name: DeepSeek V4.1 Flash
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, high, max]
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 384000
        tokenizer: deepseek-v3
        # Peak tariff (UTC 00:30–16:30). Off-peak is half: 0.15 / 0.60 / 0.003.
        # omp keeps one rate card per model; this is the conservative one.
        cost:
          input: 0.30
          output: 1.20
          cacheRead: 0.006
          cacheWrite: 0.30
        compat:
          reasoningContentField: reasoning_content
          requiresReasoningContentForToolCalls: true   # V4 thinking mode must round-trip reasoning on tool turns
          disableReasoningOnToolChoice: true           # DeepSeek 400s on reasoning + tool_choice
          streamIdleTimeoutMs: 600000                  # :max can think for minutes before the first token
