modelRoles:
  smol: deepseek/deepseek-v4-flash:high
  slow: anthropic/claude-fable-5:max
  vision: anthropic/claude-sonnet-4-5
  plan: anthropic/claude-opus-5:xhigh
  advisor: anthropic/claude-sonnet-4-5:medium
  task: deepseek/deepseek-v4-flash:high
  commit: deepseek/deepseek-v4-flash:minimal
  tiny: deepseek/deepseek-v4-flash:minimal
  default: anthropic/claude-fable-5:xhigh
  designer: anthropic/claude-fable-5:xhigh
symbolPreset: nerd
theme:
  dark: titanium
advisor:
  enabled: true
  syncBacklog: 1
memory:
  backend: local
autolearn:
  enabled: true
bash:
  patterns:
    - match: rm -rf *
      approval: prompt
    - match: git push * --force*
      approval: prompt
    - match: git push * -f*
      approval: prompt
    - match: git reset --hard *
      approval: prompt
    - match: "* | sh"
      approval: prompt
branchSummary:
  enabled: true
cycleOrder:
  - smol
  - default
  - slow
retry:
  fallbackChains:
    default:
      - anthropic/claude-sonnet-4-5
      - google-antigravity/gemini-3.6-flash
    smol:
      - google-antigravity/gemini-3.6-flash:minimal
      - openai-codex/gpt-5.4-mini:minimal
    slow:
      - anthropic/claude-fable-5:max
      - deepseek/deepseek-v4-pro:max
    deepseek/*:
      - anthropic/*
      - google-antigravity/*
    anthropic/*:
      - deepseek/*
      - google-antigravity/*
providers:
  anthropic:
    serverSideFallback: true
task:
  isolation:
    mode: auto
    apply: true
  eager: always
  agentAdvisor:
    task: "on"
lsp:
  formatOnWrite: true
personality: pragmatic
statusLine:
  preset: nerd
browser:
  relay: true
setupVersion: 2
dev:
  autoqaConsent: granted
vault:
  enabled: true
readLineNumbers: true
composer:
  shape: claude