modelRoles:
  default: google-antigravity/gemini-4-argon:high
  plan: google-antigravity/claude-opus-5-5:high
  slow: google-antigravity/claude-opus-5-5:high
  task: deepseek/deepseek-flash:high
  smol: deepseek/deepseek-flash:low
  tiny: deepseek/deepseek-flash:low
  commit: deepseek/deepseek-flash:low
  vision: google-antigravity/gemini-4-argon:medium
  designer: google-antigravity/gemini-4-argon:high
  advisor: google-antigravity/claude-sonnet-5-5:low
  scout: deepseek/deepseek-flash:low
  critic: google-antigravity/claude-opus-5-5:high
  sentinel: google-antigravity/claude-opus-5-5:high
  web: google-antigravity/gemini-3.8-flash:low
  image: google-antigravity/gemini-3-pro-image
  judge: typesafe/jev-1.14.0
modelProviderOrder:
  - google-antigravity
  - deepseek
cycleOrder:
  - smol
  - task
  - default
  - slow
disabledProviders:
  - google-gemini-cli
defaultThinkingLevel: auto
hideThinkingBlock: false
providers:
  autoThinkingMaxEffort: xhigh
  maxInFlightRequests:
    google-antigravity: 8
    deepseek: 16
retry:
  enabled: true
  maxRetries: 10
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  usageAwareFallback: true
  fallbackChains:
    deepseek/deepseek-flash:
      - google-antigravity/gemini-3.8-flash:low
      - google-antigravity/claude-sonnet-5-5:medium
    google-antigravity/*:
      - deepseek/deepseek-flash:high
      - deepseek/deepseek-v4-pro:high
    default:
      - deepseek/deepseek-flash:high
    web:
      - google-antigravity/gemini-3.8-flash
      - web/perplexity
      - web/duckduckgo
      - web/parallel
      - web/hosted
      - web/exa
      - web/firecrawl
      - web/searxng
      - web/startpage
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
    image:
      - google-antigravity/gemini-3-pro-image
      - google-antigravity/gemini-3.1-flash-image
    judge:
      - typesafe/jev-latest
      - "@tiny"
      - "@smol"
      - "@default"
task:
  eager: always
  enableLsp: true
  enableEffort: true
  maxConcurrency: 16
  maxRecursionDepth: 2
  isolation:
    merge: patch
    enabled: true
    apply: true
  agentModelOverrides:
    scout: "@scout"
    reviewer: "@critic"
    security-reviewer: "@sentinel"
    sonic: "@smol"
    task: "@task"
advisor:
  enabled: true
  syncBacklog: "off"
  immuneTurns: 3
compaction:
  enabled: true
  midTurnEnabled: true
  keepRecentTokens: 20000
  methodOrder:
    - snapcompact
    - remote
    - soft
contextPromotion:
  enabled: false
memory:
  backend: mnemopi
lsp:
  enabled: true
  lazy: true
  shared: true
  diagnosticsOnWrite: true
  diagnosticsOnEdit: false
  formatOnWrite: true
edit:
  mode: hashline
  fuzzyMatch: true
read:
  summarize:
    enabled: true
secrets:
  enabled: true
isolation:
  backend: auto
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: titanium
setupVersion: 2
autolearn:
  enabled: true
bash:
  patterns:
    - match: rm -rf *
      approval: prompt
    - match: git push * --force*
      approval: prompt
    - match: git push * -f*
      approval: prompt
    - match: git reset --hard *
      approval: prompt
    - match: "* | sh"
      approval: prompt
branchSummary:
  enabled: true
browser:
  relay: true
dev:
  autoqaConsent: granted
eval:
  workpool:
    freshAgents: true
personality: pragmatic
readLineNumbers: true
statusLine:
  preset: nerd
vault:
  enabled: true
features:
  unexpectedStopDetection: smart