modelRoles:
  default: anthropic/claude-opus-5
  plan: anthropic/claude-fable-5-1:xhigh
  slow: anthropic/claude-fable-5-1:max
  task: deepseek/deepseek-flash:high
  smol: deepseek/deepseek-flash:low
  tiny: deepseek/deepseek-flash:low
  commit: deepseek/deepseek-flash:low
  vision: google-antigravity/gemini-3.8-flash:medium
  designer: openai-codex/gpt-6-astra:high
  advisor: google-antigravity/gemini-3.8-flash:low
  scout: deepseek/deepseek-flash:low
  critic: openai-codex/gpt-6-astra:high
  sentinel: google-antigravity/gemini-3.8-flash:high
modelProviderOrder:
- deepseek
- anthropic
- openai-codex
- google-antigravity
cycleOrder:
- smol
- task
- default
- slow
disabledProviders:
- google-gemini-cli
defaultThinkingLevel: auto
hideThinkingBlock: false
providers:
  autoThinkingMaxEffort: xhigh
  webSearchOrder:
  - codex
  - gemini
  - perplexity
  - duckduckgo
  webSearchGeminiModel: gemini-3.8-flash
  imageOrder:
  - gemini
  - openai-codex
  maxInFlightRequests:
    anthropic: 4
    google-antigravity: 8
    deepseek: 16
  anthropic:
    serverSideFallback: true
retry:
  enabled: true
  maxRetries: 10
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  usageAwareFallback: true
  fallbackChains:
    deepseek/deepseek-flash:
    - google-antigravity/gemini-3.8-flash:low
    - anthropic/claude-haiku-4-5
    anthropic/*:
    - openai-codex/gpt-6-astra:high
    - google-antigravity/gemini-3.1-pro:high
    openai-codex/*:
    - anthropic/claude-opus-5:high
    - google-antigravity/gemini-3.1-pro:high
    google-antigravity/*:
    - deepseek/deepseek-flash:high
    - openai-codex/gpt-5.6-terra:medium
    default:
    - deepseek/deepseek-flash:high
task:
  eager: preferred
  enableLsp: true
  enableEffort: true
  maxConcurrency: 16
  maxRecursionDepth: 2
  isolation:
    merge: patch
    enabled: true
    apply: true
  agentModelOverrides:
    scout: '@scout'
    reviewer: '@critic'
    security-reviewer: '@sentinel'
    sonic: '@smol'
    task: '@task'
advisor:
  enabled: true
  syncBacklog: 'off'
  immuneTurns: 3
compaction:
  enabled: true
  midTurnEnabled: true
  keepRecentTokens: 20000
  methodOrder:
  - snapcompact
  - remote
  - soft
contextPromotion:
  enabled: false
memory:
  backend: mnemopi
lsp:
  enabled: true
  lazy: true
  shared: true
  diagnosticsOnWrite: true
  diagnosticsOnEdit: false
  formatOnWrite: true
edit:
  mode: hashline
  fuzzyMatch: true
read:
  summarize:
    enabled: true
secrets:
  enabled: true
isolation:
  backend: auto
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: titanium
setupVersion: 2
autolearn:
  enabled: true
bash:
  patterns:
  - match: rm -rf *
    approval: prompt
  - match: git push * --force*
    approval: prompt
  - match: git push * -f*
    approval: prompt
  - match: git reset --hard *
    approval: prompt
  - match: '* | sh'
    approval: prompt
branchSummary:
  enabled: true
browser:
  relay: true
dev:
  autoqaConsent: granted
eval:
  workpool:
    freshAgents: true
personality: pragmatic
readLineNumbers: true
statusLine:
  preset: nerd
vault:
  enabled: true
