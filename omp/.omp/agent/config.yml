modelRoles: 
  default: deepseek/deepseek-v4-pro
  smol: deepseek/deepseek-v4-flash:minimal
  slow: anthropic/claude-opus-5:max
  vision: anthropic/claude-sonnet-4-5
  plan: anthropic/claude-opus-5:xhigh
  advisor: anthropic/claude-sonnet-4-5:medium
  task: deepseek/deepseek-v4-flash:high
  designer: anthropic/claude-fable-5:high
  commit: deepseek/deepseek-v4-flash:minimal
  tiny: deepseek/deepseek-v4-flash:minimal
symbolPreset: nerd
theme: 
  dark: titanium
advisor: 
  enabled: true
  syncBacklog: 1
  subagents: true
memory: 
  backend: local
autolearn: 
  enabled: true
bash: 
  patterns: 
    - match: rm -rf *
      approval: prompt
    - match: git push * --force*
      approval: prompt
    - match: git push * -f*
      approval: prompt
    - match: git reset --hard *
      approval: prompt
    - match: "* | sh"
      approval: prompt
branchSummary: 
  enabled: true
cycleOrder: 
  - smol
  - default
  - slow
retry: 
  fallbackChains: 
    default: 
      - anthropic/claude-sonnet-4-5
      - google-antigravity/gemini-3.5-flash
    smol: 
      - google-antigravity/gemini-3.5-flash:minimal
      - openai-codex/gpt-5.4-mini:minimal
    slow: 
      - anthropic/claude-fable-5:max
      - deepseek/deepseek-v4-pro:max
    deepseek/*: 
      - anthropic/*
      - google-antigravity/*
    anthropic/*: 
      - deepseek/*
      - google-antigravity/*
providers: 
  anthropic: 
    serverSideFallback: true
task: 
  isolation: 
    mode: auto
    apply: true
  eager: always
lsp: 
  formatOnWrite: true
personality: pragmatic
statusLine: 
  preset: nerd
browser: 
  relay: true